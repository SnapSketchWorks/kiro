<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<!-- 미현상(未現像) — 단일 파일 리더. 이 파일 하나만 있으면 오프라인에서 읽을 수 있습니다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="description" content="장편소설 미현상(未現像) — 아버지의 서른세 번째 여름. 사진과 AI, 그리고 한 남자가 쓴 이야기.">
<title>미현상(未現像) — 아버지의 서른세 번째 여름</title>
<style>
/* ============================================================
   미현상(未現像) — 리더 스타일
   PC / 모바일 반응형 · 라이트 / 세피아 / 다크 테마
   ============================================================ */

:root {
  --serif: "Nanum Myeongjo", "Apple SD Gothic Neo", "Noto Serif KR", "본명조",
           "Batang", "함초롬바탕", Georgia, serif;
  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "SFMono-Regular", ui-monospace, "D2Coding", Consolas, monospace;

  --fs: 18px;
  --lh: 1.95;
  --mw: 40rem;

  --dur: .22s;
  --radius: 12px;
  --topbar-h: 52px;
}

html[data-size="1"] { --fs: 15.5px; }
html[data-size="2"] { --fs: 17px; }
html[data-size="3"] { --fs: 18.5px; }
html[data-size="4"] { --fs: 20.5px; }
html[data-size="5"] { --fs: 23px; }

html[data-leading="tight"]  { --lh: 1.7; }
html[data-leading="normal"] { --lh: 1.95; }
html[data-leading="loose"]  { --lh: 2.25; }

html[data-width="narrow"] { --mw: 34rem; }
html[data-width="normal"] { --mw: 40rem; }
html[data-width="wide"]   { --mw: 48rem; }

html[data-font="sans"] { --body-font: var(--sans); }
html[data-font="serif"], html:not([data-font]) { --body-font: var(--serif); }

/* ---------- 테마 ---------- */
html[data-theme="light"] {
  --bg: #f7f5f1;
  --bg-elev: #fffefb;
  --bg-sunken: #efece5;
  --fg: #1d2126;
  --fg-soft: #4a5158;
  --fg-dim: #7b838c;
  --line: #ddd8cf;
  --line-soft: #e8e4dc;
  --accent: #8a5a2b;
  --accent-soft: rgba(138, 90, 43, .1);
  --shadow: 0 8px 30px rgba(31, 28, 22, .12);
  --glass: rgba(247, 245, 241, .86);
}
html[data-theme="sepia"] {
  --bg: #f2e7d3;
  --bg-elev: #fbf3e3;
  --bg-sunken: #e9dcc4;
  --fg: #33291c;
  --fg-soft: #59492f;
  --fg-dim: #8a7752;
  --line: #d9c8a6;
  --line-soft: #e3d5b8;
  --accent: #9a5b1e;
  --accent-soft: rgba(154, 91, 30, .12);
  --shadow: 0 8px 30px rgba(80, 60, 25, .16);
  --glass: rgba(242, 231, 211, .88);
}
html[data-theme="dark"] {
  --bg: #14161a;
  --bg-elev: #1c1f25;
  --bg-sunken: #101216;
  --fg: #cdd2d8;
  --fg-soft: #a3abb4;
  --fg-dim: #6e7783;
  --line: #2b3038;
  --line-soft: #22262d;
  --accent: #d3a06a;
  --accent-soft: rgba(211, 160, 106, .13);
  --shadow: 0 10px 34px rgba(0, 0, 0, .5);
  --glass: rgba(20, 22, 26, .84);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body-font);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
  word-break: keep-all;
  transition: background-color var(--dur) ease, color var(--dur) ease;
}

body.is-locked { overflow: hidden; }

svg {
  width: 22px; height: 22px;
  fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}

button { font-family: var(--sans); color: inherit; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ---------- 진행률 ---------- */
.progress {
  position: fixed; inset: 0 0 auto 0;
  height: 2px; z-index: 60;
  background: transparent;
}
.progress__bar {
  height: 100%; width: 0;
  background: var(--accent);
  transition: width .1s linear;
}

/* ---------- 상단 바 ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px;
  padding-top: env(safe-area-inset-top);
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line-soft);
  transform: translateY(0);
  transition: transform .28s ease, opacity .28s ease;
}
.topbar.is-hidden { transform: translateY(calc(-100% - 4px)); }

.iconbtn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px;
  border: 0; border-radius: 10px;
  background: transparent;
  color: var(--fg-soft);
  transition: background var(--dur), color var(--dur);
  flex: 0 0 auto;
}
.iconbtn:hover { background: var(--bg-sunken); color: var(--fg); }

.topbar__title {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--fg-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  justify-content: center;
}
.topbar__book { color: var(--fg-soft); font-weight: 600; letter-spacing: .02em; }
.topbar__sep { opacity: .5; }
.topbar__chap { overflow: hidden; text-overflow: ellipsis; }
.topbar__right { display: flex; gap: 2px; flex: 0 0 auto; }

html[data-theme="dark"] .ic-moon { display: none; }
html[data-theme="dark"] .ic-sun { display: block; }
html:not([data-theme="dark"]) .ic-moon { display: block; }
html:not([data-theme="dark"]) .ic-sun { display: none; }

/* ---------- 스크림 ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(0, 0, 0, .45);
  opacity: 0;
  transition: opacity var(--dur) ease;
}
.scrim.is-open { opacity: 1; }

/* ---------- 목차 ---------- */
.toc {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: min(84vw, 340px);
  z-index: 80;
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  box-shadow: var(--shadow);
  transform: translateX(-102%);
  transition: transform .28s cubic-bezier(.32, .72, 0, 1);
  padding-top: env(safe-area-inset-top);
}
.toc.is-open { transform: translateX(0); }

.toc__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 10px 12px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.toc__book { display: flex; align-items: baseline; gap: 8px; }
.toc__book strong { font-size: 19px; letter-spacing: .06em; }
.toc__book span { font-size: 11px; color: var(--fg-dim); letter-spacing: .18em; }

.toc__search { padding: 12px 14px 6px; }
.toc__search input {
  width: 100%; height: 36px;
  padding: 0 12px;
  font-family: var(--sans); font-size: 13px;
  color: var(--fg);
  background: var(--bg-sunken);
  border: 1px solid var(--line-soft);
  border-radius: 9px;
}
.toc__search input::placeholder { color: var(--fg-dim); }

.toc__stats {
  padding: 6px 16px 10px;
  font-family: var(--sans); font-size: 11.5px;
  color: var(--fg-dim);
  border-bottom: 1px solid var(--line-soft);
}

.toc__list {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 0 40px;
  -webkit-overflow-scrolling: touch;
}

.toc__vol {
  padding: 18px 18px 6px;
  font-family: var(--sans);
  font-size: 11px; font-weight: 700;
  letter-spacing: .2em;
  color: var(--accent);
  text-transform: uppercase;
}
.toc__part {
  padding: 14px 18px 6px;
  display: flex; align-items: baseline; gap: 7px;
  border-top: 1px solid var(--line-soft);
  margin-top: 6px;
}
.toc__part b { font-size: 14px; letter-spacing: .04em; }
.toc__part i { font-style: normal; font-size: 10.5px; color: var(--fg-dim); letter-spacing: .1em; }

.toc__item {
  display: flex; align-items: baseline; gap: 10px;
  width: 100%;
  padding: 9px 18px;
  border: 0; background: transparent;
  font-family: var(--sans);
  font-size: 13.5px; line-height: 1.5;
  color: var(--fg-soft);
  text-align: left;
  border-left: 2px solid transparent;
  transition: background var(--dur), color var(--dur);
}
.toc__item:hover { background: var(--bg-sunken); color: var(--fg); }
.toc__item.is-current {
  color: var(--accent);
  background: var(--accent-soft);
  border-left-color: var(--accent);
  font-weight: 600;
}
.toc__item.is-read { color: var(--fg-dim); }
.toc__item.is-read.is-current { color: var(--accent); }
.toc__no {
  flex: 0 0 auto;
  font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--fg-dim);
  min-width: 2.2em;
}
.toc__item.is-current .toc__no { color: var(--accent); }
.toc__t { flex: 1 1 auto; }
.toc__dot {
  flex: 0 0 auto; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); opacity: 0; margin-top: .55em;
}
.toc__item.is-read .toc__dot { opacity: .5; }

/* ---------- 설정 시트 ---------- */
.sheet {
  position: fixed; z-index: 85;
  right: 10px; top: calc(var(--topbar-h) + 8px + env(safe-area-inset-top));
  width: min(92vw, 340px);
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  opacity: 0; transform: translateY(-8px) scale(.98);
  transition: opacity var(--dur) ease, transform var(--dur) ease;
  pointer-events: none;
}
.sheet.is-open { opacity: 1; transform: none; pointer-events: auto; }
.sheet__inner { padding: 16px 16px 12px; }
.sheet__grip { display: none; }

.field { margin-bottom: 14px; }
.field__label {
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: .12em; color: var(--fg-dim);
  margin-bottom: 7px;
}
.seg {
  display: flex; gap: 4px;
  background: var(--bg-sunken);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 3px;
}
.seg button {
  flex: 1 1 0; min-width: 0;
  height: 32px;
  border: 0; border-radius: 7px;
  background: transparent;
  color: var(--fg-soft);
  font-size: 12.5px; font-weight: 500;
  white-space: nowrap;
  transition: background var(--dur), color var(--dur);
}
.seg button:hover { color: var(--fg); }
.seg button.is-on {
  background: var(--bg-elev);
  color: var(--accent);
  font-weight: 700;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
}
#setSize button:nth-child(1) { font-size: 11px; }
#setSize button:nth-child(2) { font-size: 12.5px; }
#setSize button:nth-child(3) { font-size: 14px; }
#setSize button:nth-child(4) { font-size: 16px; }
#setSize button:nth-child(5) { font-size: 18px; }

.sheet__foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}
.kbd-hint { font-family: var(--sans); font-size: 10.5px; color: var(--fg-dim); }
.kbd-hint b {
  font-weight: 600; color: var(--fg-soft);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 0 4px;
}
.textbtn {
  border: 0; background: transparent;
  font-size: 11.5px; color: var(--fg-dim);
  text-decoration: underline; text-underline-offset: 3px;
  padding: 4px;
}
.textbtn:hover { color: var(--fg); }

/* ---------- 표지 ---------- */
main { padding-top: var(--topbar-h); }

.cover {
  min-height: calc(100vh - var(--topbar-h));
  min-height: calc(100svh - var(--topbar-h));
  display: grid; place-items: center;
  padding: 40px 22px 60px;
}
.cover__inner { max-width: 34rem; text-align: center; }
.cover__kicker {
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: .34em; color: var(--fg-dim);
  margin: 0 0 22px;
}
.cover__title {
  margin: 0;
  font-size: clamp(46px, 15vw, 84px);
  font-weight: 400; letter-spacing: .07em; line-height: 1.05;
  position: relative;
}
.cover__title span {
  display: block;
  font-size: .2em; letter-spacing: .5em;
  color: var(--fg-dim);
  margin-top: 16px;
  text-indent: .5em;
}
.cover__sub {
  margin: 26px 0 0;
  font-size: clamp(14px, 4vw, 16px);
  color: var(--fg-soft); letter-spacing: .1em;
}
.cover__rule {
  width: 46px; height: 1px; background: var(--line);
  margin: 34px auto;
}
.cover__blurb {
  margin: 0;
  font-size: clamp(13px, 3.6vw, 14.5px);
  line-height: 2.1; color: var(--fg-soft);
}
.cover__actions {
  margin-top: 40px;
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
}
.btn {
  font-family: var(--sans); font-size: 13.5px; font-weight: 600;
  padding: 12px 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-elev);
  color: var(--fg-soft);
  transition: all var(--dur);
}
.btn:hover { color: var(--fg); border-color: var(--fg-dim); }
.btn--primary {
  background: var(--accent); border-color: var(--accent);
  color: #fff;
}
html[data-theme="dark"] .btn--primary { color: #17191d; }
.btn--primary:hover { filter: brightness(1.08); color: #fff; }
html[data-theme="dark"] .btn--primary:hover { color: #17191d; }
.cover__meta {
  margin: 34px 0 0;
  font-family: var(--sans); font-size: 11px; color: var(--fg-dim);
  letter-spacing: .06em;
}

/* ---------- 본문 ---------- */
.reader {
  max-width: var(--mw);
  margin: 0 auto;
  padding: 26px 22px 30px;
  padding-bottom: 40px;
}

.chead { margin: 20px 0 52px; text-align: center; }
.chead__part {
  font-family: var(--sans); font-size: 10.5px; font-weight: 600;
  letter-spacing: .26em; color: var(--fg-dim);
  margin: 0 0 22px;
}
.chead__no {
  font-family: var(--sans);
  font-size: 12px; letter-spacing: .3em; color: var(--accent);
  margin: 0 0 14px;
}
.chead__title {
  margin: 0;
  font-size: clamp(24px, 7vw, 33px);
  font-weight: 400; line-height: 1.4; letter-spacing: .02em;
}
.chead__rule {
  width: 30px; height: 1px; background: var(--line);
  margin: 30px auto 0;
}

.body { font-size: var(--fs); line-height: var(--lh); }
.body p {
  margin: 0 0 1.15em;
  letter-spacing: -.003em;
  text-align: left;
}
.body p.lead::first-letter {
  font-size: 2.1em; line-height: 1;
  float: left;
  padding: .08em .12em 0 0;
  color: var(--accent);
}
.body h3 {
  margin: 2.6em 0 1.2em;
  font-size: 1.02em; font-weight: 700;
  letter-spacing: .08em; color: var(--fg-soft);
  font-family: var(--sans);
}
.body em { font-style: italic; color: var(--fg); }
.body strong { font-weight: 700; }

.body .sep {
  margin: 2.4em 0;
  text-align: center;
  color: var(--fg-dim);
  letter-spacing: 1em;
  font-size: .8em;
  user-select: none;
}
.body .sep::before { content: "◇"; letter-spacing: 0; }

.body blockquote {
  margin: 1.9em 0;
  padding: .2em 0 .2em 1.15em;
  border-left: 2px solid var(--line);
  color: var(--fg-soft);
  font-size: .95em;
}
.body blockquote p { margin-bottom: .7em; }
.body blockquote p:last-child { margin-bottom: 0; }

.body .log {
  margin: 1.9em 0;
  padding: 1em 1.1em;
  background: var(--bg-sunken);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  font-family: var(--mono);
  font-size: .82em;
  line-height: 1.85;
  color: var(--fg-soft);
  white-space: pre-wrap;
  overflow-x: auto;
}
.body .log b { color: var(--accent); font-weight: 600; }

.body .caption {
  margin: 1.9em 0;
  padding: 1em 1.2em;
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  font-size: .88em;
  line-height: 1.9;
  color: var(--fg-soft);
  text-align: center;
  letter-spacing: .02em;
}
.body .caption b { color: var(--fg); font-weight: 600; }

/* 화 끝 */
.chend { margin: 60px 0 0; text-align: center; }
.chend__mark {
  color: var(--fg-dim); letter-spacing: .5em; font-size: .8em;
}
.nextcard {
  display: block; width: 100%;
  margin: 34px 0 0;
  padding: 20px 22px;
  text-align: left;
  background: var(--bg-elev);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  transition: all var(--dur);
}
.nextcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.nextcard__k {
  display: block;
  font-family: var(--sans); font-size: 10.5px; font-weight: 600;
  letter-spacing: .2em; color: var(--fg-dim);
  margin-bottom: 8px;
}
.nextcard__t {
  display: block;
  font-size: 16px; color: var(--fg);
  letter-spacing: .01em;
}
.theend {
  margin: 40px 0 0;
  padding: 28px;
  text-align: center;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--bg-elev);
}
.theend b { display: block; font-size: 15px; letter-spacing: .3em; margin-bottom: 10px; }
.theend span { font-family: var(--sans); font-size: 12px; color: var(--fg-dim); }

/* ---------- 하단 페이저 ---------- */
.pager {
  position: sticky; bottom: 0;
  z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
  max-width: var(--mw);
  margin: 0 auto;
  padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
}
.pager__btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 14px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: transparent;
  color: var(--fg-soft);
  font-family: var(--sans); font-size: 12.5px; font-weight: 500;
  transition: all var(--dur);
}
.pager__btn:hover:not(:disabled) { color: var(--fg); border-color: var(--fg-dim); }
.pager__btn:disabled { opacity: .32; cursor: default; }
.pager__btn--mid { border: 0; color: var(--fg-dim); font-size: 11.5px; }
.pager__btn svg { width: 17px; height: 17px; }

/* ---------- 반응형 ---------- */
@media (max-width: 600px) {
  .reader { padding: 18px 18px 24px; }
  .chead { margin: 8px 0 40px; }
  .sheet {
    right: 0; left: 0; top: auto; bottom: 0;
    width: auto;
    border-radius: 18px 18px 0 0;
    border-left: 0; border-right: 0; border-bottom: 0;
    transform: translateY(14px);
  }
  .sheet.is-open { transform: none; }
  .sheet__inner { padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet__grip {
    display: block; width: 38px; height: 4px;
    background: var(--line); border-radius: 99px;
    margin: 8px auto 16px;
  }
  .sheet__foot { flex-direction: column-reverse; align-items: stretch; gap: 6px; }
  .kbd-hint { display: none; }
  .body .log { font-size: .78em; }
}

@media (min-width: 1080px) {
  .topbar__title { justify-content: flex-start; padding-left: 6px; font-size: 13.5px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- 인쇄 ---------- */
@media print {
  .topbar, .pager, .toc, .scrim, .sheet, .progress, .cover { display: none !important; }
  main { padding: 0; }
  .reader { max-width: none; padding: 0; }
  body { background: #fff; color: #000; }
  .body { font-size: 11pt; line-height: 1.8; }
  .chead { page-break-before: always; }
  .nextcard, .chend { display: none; }
}
</style>

<script>
/* 제1부 노출(露出) */

NOVEL.addChapter({
  part: 'p1', no: 1, title: '미현상',
  body: `
사람이 죽으면 남는 것은 짐이다.

나는 그것을 아버지의 장례 사흘 뒤, 삼계읍 태양사진관 셔터를 올리면서 배웠다. 셔터는 삼 분의 일쯤 올라가다 걸렸다. 아래쪽 레일에 십오 년쯤 묵은 흙이 굳어 있었다. 나는 몸을 반으로 접어 그 틈으로 기어들어 갔고, 그 자세로 마흔셋의 겨울을 시작했다.

안은 밖보다 추웠다.

유리문 안쪽에 코팅한 증명사진 견본들이 아직 붙어 있었다. 파란 배경 앞에서 어색하게 웃는 사람들. 1990년대의 파마머리, 2000년대의 은테 안경, 그리고 어느 시점부터는 아무도 없다. 사람들이 사진관에 오지 않게 된 정확한 해가 벽에 남아 있었다. 견본 사진의 마지막 줄은 2011년에 멈췄다.

카운터 위에는 아버지가 쓰던 돋보기와, 커터칼과, 유리컵이 있었다. 유리컵 바닥에 커피가 반쯤 남아 말라 있었다. 응급실로 실려 가기 전에 마시던 것이겠지. 나는 그 컵을 씻지 않고 그대로 뒀다. 왜 그랬는지는 지금도 모른다.

"뭐 하냐, 안 들어오고."

누나가 뒤에서 셔터를 두드렸다. 나는 안쪽 자물쇠를 풀어 문을 열었다. 진경은 롱패딩 지퍼를 턱까지 올린 채 들어와서, 삼 초쯤 사진관을 둘러보고 이렇게 말했다.

"폐기물 업체가 백사십 부른다."

"백사십."

"트럭 두 대. 유리, 목재, 폐약품 분리해서. 약품이 문제야. 그거 그냥 못 버려."

"응."

"응이 아니고." 누나는 장갑을 벗어 손바닥을 털었다. "너 다음 주에 또 회사 바쁘다고 하면 나 혼자 해. 그럼 나 혼자 하는 거야. 알겠지."

나는 알겠다고 했다. 누나는 알겠다는 말을 신뢰하지 않는 얼굴로 나를 봤다. 그럴 만했다. 아버지가 병원과 집을 열한 번 왕복하는 동안, 나는 그중 세 번을 함께했고, 여덟 번은 회의 중이었다.

---

장례는 사흘이었다.

문상객은 스물아홉 명이었다. 나는 그 숫자를 세었다. 왜 세었는지는 모른다. 사람이 죽으면 남는 것이 짐이라는 문장을 배우기 전에, 나는 사람이 죽으면 숫자를 센다는 것을 먼저 배웠다.

스물아홉 명 중 열둘은 내 회사 사람이었다. 배윤철 팀장이 화환을 보내고 직접 왔다. 오상철이 조의금 봉투를 내면서 어깨를 두 번 두드렸다. 그들은 삼십 분 있다가 갔다. 그게 예의였다. 나도 남의 부모 장례식에서 삼십 분 있다가 갔다.

여덟 명은 누나 쪽이었다. 요양원 동료들. 그들은 육개장을 먹으면서 서로 근무표를 바꿔 준 얘기를 했다.

나머지 아홉 명이 아버지 손님이었다.

전부 예순이 넘은 사람들이었다. 한 명씩 따로 왔다. 한 사람은 지팡이를 짚고 왔고, 한 사람은 아들이 태워다 줬고, 한 사람은 버스를 두 번 갈아탔다고 했다.

그중 한 노인이 영정 앞에서 오래 서 있었다. 나는 상주석에서 그 등을 봤다. 절을 하고, 일어나서, 다시 사진을 봤다. 그리고 나에게 와서 이렇게 말했다.

"내 결혼사진을 이 사람이 찍었어."

"…네."

"1979년에. 우리 집이 그때 돈이 없어서 사진을 못 찍는다고 했는데, 이 사람이 그냥 찍어 줬어. 값도 안 받고." 노인이 손등으로 눈을 눌렀다. "그 사진이 지금 우리 안방에 있어. 우리 마누라는 십 년 전에 죽었어. 그 사진밖에 없어."

노인은 내 손을 잡았다. 손이 아주 말라 있었다.

"고맙다고 말을 못 했어. 사십육 년 동안 못 했어."

나는 그 말을 그날 세 번 들었다. 다른 사람에게서 두 번 더.

아버지의 영정 사진은 아버지가 직접 찍은 것이었다. 누나가 사진관 서랍에서 찾아냈다. 삼각대에 카메라를 세워 놓고 셀프 타이머로 찍은 증명사진. 뒷면에 연필로 이렇게 적혀 있었다.

**2019. 3. 영정용.**

2019년이었다. 여든 살까지 살 계획이 없는 사람이 예순여섯에 자기 영정 사진을 찍어서 서랍에 넣어 둔 것이다. 배경은 사진관의 파란 커튼이었고, 아버지는 넥타이를 맸고, 웃지 않았다.

나는 그 사진을 삼 일 동안 봤다.

셋째 날 밤에, 발인 전에, 나는 그 사진 앞에 혼자 앉아 있었다. 그리고 마지막 통화를 생각했다.

아버지가 쓰러진 것은 십이월 이십일일이었다. 그 이틀 전, 십구일 밤 아홉 시 사십육 분에 아버지가 전화를 했다. 아버지는 전화를 하지 않는 사람이었다. 문자를 했다. 사 년 동안 이백여든일곱 개.

나는 그때 회식 중이었다. 김포 자동화 킥오프 전 회식. 나는 화장실 앞 복도에 나가서 받았다.

"어, 아버지."

"…"

"아버지?"

"…그래."

"뭐 필요한 거 있어요?"

"…아니다."

"저 지금 회식 중인데요. 나중에 전화드릴게요."

"…그래."

팔 초였다. 나는 나중에 통화 기록을 확인했다. 팔 초. 그중 오 초가 침묵이었다.

나는 나중에 전화하지 않았다. 이틀 뒤에 누나가 전화했고, 그때는 아버지가 말을 할 수 없는 상태였다.

영정 앞에 앉아서 나는 그 팔 초를 되짚었다. 아버지는 무슨 말을 하려고 전화했을까. 아버지가 아무 말도 하지 않은 오 초 동안 무엇을 하고 있었을까.

그리고 그날 밤, 나는 내가 앞으로 몇 년 동안 그 오 초를 붙들고 살게 될 것을 몰랐다.

---

간단히 설명하면 이렇다.

내 이름은 서진우. 마흔셋. 대성로지스 물류IT팀 차장. 창고에 들어오는 박스와 나가는 박스의 순서를 정하는 일을 한다. 아내와는 일 년 사 개월째 따로 살고, 중학교 이 학년인 딸은 격주로 만난다. 몸무게는 삼 년 사이에 칠 킬로그램 늘었고, 작년에 고등학교 동창 태섭이 죽었다. 마흔둘, 심근경색, 화요일 아침 출근길 지하철 계단. 태섭의 장례식장에서 우리는 오랜만에 열두 명이 모여, 살아 있는 사람의 건강검진 결과를 서로에게 물었다.

그리고 취미가 두 개 있다.

하나는 필름 사진. 다른 하나는, 사람들이 대개 이해하지 못하는 쪽인데, 인공지능이다.

그 두 개는 원래 하나였다. 오 년 전, 아버지가 오래된 흑백 필름 몇 장을 스캔해 달라고 했다. 스캔한 파일에는 먼지와 스크래치와 알 수 없는 얼룩이 가득했다. 나는 그걸 지우는 방법을 찾다가 오픈소스 복원 모델을 알게 됐고, 그걸 돌리려고 중고 그래픽카드를 샀고, 그걸 꽂으려고 컴퓨터 케이스를 바꿨고, 그러다 어느 날 새벽 세 시에 학습 로그가 한 줄씩 내려가는 화면을 보면서, 내가 회사에서보다 여기서 더 살아 있다는 걸 알았다.

취미란 그런 것이다. 아무도 시키지 않았는데 잘하게 되는 것.

---

  body: `
책은 구월 이일에 나왔다.

『아버지의 답장』, 서진우, 먼바다, 삼백사십 쪽, 만 칠천 원. 표지는 검은색이었다. 가운데에 흰 사각형 하나. 아무것도 인쇄되지 않은 흰 사각형. 디자이너는 그것이 미현상 필름의 프레임이라고 설명했다.

한유리가 초판 열 부를 택배로 보냈다.

나는 박스를 원룸 바닥에서 열었다. 새 책 냄새가 났다. 잉크와 종이와 접착제. 나는 한 권을 꺼내 들고, 표지를 만지고, 뒤집어서 뒤표지를 읽고, 다시 앞으로 와서, 저자 이름을 봤다.

**서진우**

나는 그것을 십오 분쯤 봤다. 그리고 책을 가슴에 얹고 방바닥에 누웠다.

마흔셋에 처음으로 세상에 내 이름이 인쇄되어 나왔다. 십구 년 동안 회사에서 내가 만든 문서는 삼천 개쯤 되는데 거기 내 이름은 결재란의 세 번째 칸에만 있었다. 그런데 이 검은 책의 앞면에는 내 이름밖에 없었다.

그날 밤 나는 아무에게도 전화하지 않았다. 자랑할 사람의 목록을 만들어 봤는데, 아버지는 죽었고, 어머니는 없고, 누나는 화가 나 있고, 아내는 서류를 기다리고 있고, 태섭은 작년에 죽었다.

목록의 끝에 딸이 있었다.

> 다인아 아빠 책 나왔다

> 진짜??
> 사진 보내 봐

> (사진)

> 와
> 미쳤다 아빠
> 나 이거 학교에 가져가도 됨?

> 왜

> 자랑하려고

나는 휴대폰을 얼굴 위에 얹고 삼십 초쯤 가만히 있었다.

> 가져가

---

첫 주는 조용했다.

교보문고에 갔다. 신간 코너를 세 번 돌았는데 없었다. 에세이 코너 다섯 번째 칸 아래에서 세 권을 찾았다. 뒤쪽에 눕혀져 있었다. 나는 그 세 권을 꺼내서, 앞줄 잘 보이는 자리에 세워 놓고, 십 분쯤 떨어진 곳에서 지켜봤다.

아무도 집지 않았다.

나는 그 자리에서 서점의 다른 책들을 봤다. 하루에 이백 종이 나온다고 한유리가 말했었다. 일 년에 칠만 종. 그 안에서 내 검은 책은 정확히 자기 몫의 자리에 있었다. 다섯 번째 칸, 아래.

집으로 오는 지하철에서 나는 이상하게 편안했다.

그때까지 나는 아직 괜찮은 사람이었다.

---

첫 인터뷰는 구월 십일일에 전화로 했다.

어느 신문의 문화부 기자였다. 삼십 대 초반의 목소리. 그녀는 질문을 아홉 개 준비해 왔고, 여덟 개를 다 하고 마지막에 이렇게 물었다.

"마지막 질문이요. 이거 좀 사적인 건데, 안 하셔도 됩니다."

"하세요."

"이 책이 애도라고 생각하세요, 아니면 다른 거라고 생각하세요?"

나는 원룸 창가에 서 있었다. 구월의 오후, 부평의 하늘.

"…애도라고 생각합니다."

"어떤 점에서요?"

"…"

나는 그때 대답을 만들었다. 그리고 그 대답은 좋았다. 너무 좋아서 나는 그것을 그 뒤 여섯 번 더 썼다. 인터뷰마다, 조금씩 다듬어서.

"애도는 죽은 사람을 보내는 일인데, 보내려면 먼저 붙잡아야 합니다. 저는 아버지를 한 번도 붙잡은 적이 없습니다. 그래서 보낼 수가 없었습니다. 이 프로그램은… 붙잡는 도구였습니다."

기자는 그 말을 그대로 받아 적었다. 기사 제목이 그 문장에서 나왔다.

**"보내려면 먼저 붙잡아야 했다" — 죽은 아버지와 대화한 40대 직장인**

기사는 사흘 뒤에 나왔다. 나는 그것을 다섯 번 읽었다. 다섯 번째로 읽으면서, 내가 그 대답을 그 통화 중에 처음 만들었다는 것을 기억했다.

만들었다는 것이 거짓말이라는 뜻은 아니다. 사람은 자기 마음을 말로 만들면서 알게 된다. 문제는 그다음이었다. 나는 그 말이 좋아서 반복했고, 반복하면서 그것이 원래 내 생각이었다고 믿게 되었다.

작가가 되는 것은 그런 것이었다. 자기 문장을 여섯 번 반복하면 그것이 자기 삶이 된다.

---

독자 편지는 구월 말부터 왔다.

출판사로 오면 한유리가 모아서 한 달에 한 번 보내 줬다. 첫 봉투에 열네 통이 들어 있었다.

대부분 아버지 이야기였다. 아버지가 돌아가셨습니다. 아버지와 십오 년 말을 안 했습니다. 아버지가 치매입니다. 아버지가 살아 계실 때 이 책을 읽어서 다행입니다.

그중 손글씨 편지가 하나 있었다. 볼펜으로, 줄 없는 종이에, 글씨가 자꾸 아래로 처지는 편지.

> 서진우 선생님. 저는 일흔넷입니다.
>
> 저는 딸이 하나 있습니다. 딸이 저와 십일 년 연락을 안 합니다. 제가 잘못한 게 있습니다. 여기 쓰지는 않겠습니다.
>
> 이 책을 손녀가 사 왔습니다. 손녀는 저와 연락합니다. 딸은 그걸 모릅니다.
>
> 선생님 책을 읽고 저는 제 딸이 나중에 이런 걸 만들까 생각했습니다. 제가 죽은 다음에 제 문자로 저를 만들어서 저와 이야기를 할까. 그리고 그런 생각을 하는 제가 부끄러웠습니다.
>
> 왜 부끄러운지 아십니까.
>
> 저는 지금 전화를 할 수 있습니다.
>
> 그런데 안 합니다.
>
> 선생님. 저는 오늘 전화를 하려고 합니다. 이 편지를 쓰고 나서 하려고 합니다. 이 편지는 그러니까 제가 저한테 쓰는 것입니다.
>
> 부치지 않을 수도 있습니다.

편지는 부쳐졌다.

나는 그 편지를 서랍에 넣었다. 그리고 그 뒤 일 년 동안 그것을 여섯 번 꺼내 읽었다. 여섯 번 다 마지막 문장에서 멈췄다.

나는 그 할아버지가 전화를 했는지 모른다. 알 방법이 없다. 답장을 쓸 주소가 적혀 있지 않았다.

그때 나는 그것이 아쉽다고 생각했다.

지금은 그분이 주소를 안 쓴 이유를 안다. 그분은 나에게 답을 받고 싶었던 게 아니었다. 그분은 자기가 그 문장을 쓴 것을 세상의 누군가 한 명이 알아 주기를 바랐던 것이다.

그것이 사람들이 편지를 쓰는 이유고, 그리고 내가 블로그를 만든 이유였다.

---

두 번째 주에 어떤 라디오 작가가 그 책을 읽었다.

새벽 프로그램이었다. 진행자가 이백여든두 쪽을 읽었다.

> 아버지, 그때 왜 나한테 아무 말도 안 했어요.
> 진우야. 미안하다. 그때 내가 너한테 말을 못 했다. 너는 잘못한 게 없다.

라디오 게시판에 그날 밤 사백 개의 사연이 올라왔다고 한다.

목요일 아침에 한유리가 전화했다.

"서진우 씨, 이 주 중에 사인 가능하세요?"

"사인이요?"

"이쇄 들어갔어요. 이천 부. 그리고 광화문에서 저자 사인본 하자고 해서요. 백 권."

"백 권을요?"

"백 권요. 손목 조심하세요. 볼펜 두 개 준비하시고. 그리고 하나 여쭤볼게요." 그녀가 잠깐 멈췄다. "회사에 말하셨어요?"

나는 사무실 창밖의 물류센터 지붕을 봤다.

"아니요."

"곧 아셔야 할 거예요."

---

배윤철 팀장이 알게 된 건 그다음 주 수요일이었다.

점심을 먹고 들어오는데 팀장이 나를 불렀다. 그의 책상 위에 내 책이 있었다. 검은 책. 흰 사각형.

"서 차장. 이게 자네야?"

"…네."

"어허."

팀장은 그 책을 들고 잠깐 뒤적였다. 그리고 이렇게 말했다.

"이거 회사 얘기는 없지?"

"없습니다."

"AI 얘기는 있네." 그가 페이지를 짚었다. "우리 프로젝트 얘기 아니지?"

"아닙니다. 취미로 하는 겁니다."

"취미." 팀장이 책을 덮었다. "서 차장, 나는 자네를 오 년 봤는데 이런 사람인 줄 몰랐어. 근데 이건 알아 둬. 회사는 직원이 유명해지는 걸 안 좋아해."

"네."

"그리고 이번 TF 마무리가 십일월이야. 그때까지 딴 데 정신 팔면 안 돼. 위에서 자네 이름 보고 있어."

나는 자리로 돌아왔다. 십 분 뒤 사내 메신저에 상철에게서 메시지가 왔다.

> 차장님 책 방금 주문했습니다
> 근데 팀장님 어떻게 알았는지 아세요?
> 사모님이 라디오 듣고 사셨대요
> 그리고 이거 지금 물류센터 여자분들이 다 돌려 보고 있어요

---

사인회는 광화문 서점 오 층 행사장에서 했다.

백 권에 사인하는 데 오십 분이 걸렸다. 나는 볼펜을 두 개 준비했고 한 개를 다 썼다. 서명 아래에 뭐라고 쓸지 몰라서 처음 스무 권에는 아무것도 안 쓰고, 그다음 여든 권에는 이렇게 썼다.

**아직 현상되지 않은 것들이 있습니다.**

사인이 끝날 때쯤 사람들이 줄을 서 있었다.

열아홉 명이었다. 나는 그 열아홉 명의 얼굴을 지금도 기억한다. 스물몇 살의 여자가 다섯 명, 사십 대 남자가 여섯 명, 육십 대가 넷, 학생이 둘, 그리고 아기를 안은 여자 하나.

사십 대 남자 중 한 명이 자기 차례에서 이렇게 말했다.

"저는… 아버지 돌아가시고 삼 년 됐는데요."

"네."

"휴대폰에 문자가 백열두 개 남아 있어요. 그거로도 될까요?"

나는 볼펜을 놓았다.

그 질문에 어떻게 대답했어야 하는지 나는 아직도 모른다. 나중에 나는 그 질문에 대답한 값을 아주 크게 치른다. 그때 내가 뭐라고 했는지는 이렇다.

"될 겁니다."

"…고맙습니다." 남자가 고개를 숙였다. 목이 붉었다. "고맙습니다."

집으로 오는 지하철에서 나는 그 남자를 생각했다. 그는 아버지의 문자 백열두 개로 무엇을 만들 것이다. 그리고 그것이 아버지가 하지 않은 말을 할 것이다. 그리고 그는 울 것이다. 나처럼.

나는 그 사람에게 그 말을 하지 않았다. 그게 사업이라서가 아니었다. 그 말을 하면 내 책의 이백여든두 쪽이 무너지기 때문이었다.

---

책은 사 주 만에 오만 부를 넘었다.

그 사이에 세 가지가 일어났다.

첫째, 서점의 종합 베스트셀러 목록에 검은 책이 올라갔다. 십일 위, 육 위, 삼 위.

둘째, 어떤 기사 제목이 이렇게 나왔다. **AI로 죽은 아버지를 되살린 40대 직장인, 화제의 에세이.** 나는 그 제목이 싫었다. 되살린 적이 없었기 때문이다. 그런데 반론하지 않았다. 그 기사 덕에 그 주에 팔천 부가 나갔다.

셋째, 십월 십칠일 밤 열한 시 사십 분에 누나가 전화했다.

누나는 육 개월 동안 내 전화를 받지 않았다. 그러니까 육 개월 만이었다.

"진우야."

"…누나."

"책 읽었어."

나는 침대에 앉았다. 창밖에서 트럭이 지나갔다.

"어."

"삼백이십 쪽." 누나의 목소리는 아주 평평했다. "네가 마지막에 쓴 거. 아버지가 아무것도 안 했다고 쓴 거."

"…응."

"그거 아니야."

나는 눈을 감았다.

"뭐가 아니야."

"진우야." 누나가 말했다. "엄마는 그날 안 죽었어."
`

  part: 'p2', no: 11, title: '그날 밤의 마루',
  body: `
우리는 삼계읍 터미널 앞 기사식당에서 만났다.

누나가 고른 장소였다. 요양원 근무가 세 시에 끝나서 그 앞이 좋다고 했다. 나는 두 시 사십 분에 도착해서 이십 분 동안 창밖을 봤다. 터미널 앞은 삼십 년 전과 같았다. 간판만 바뀌었다. 문구사가 휴대폰 대리점이 되고, 다방이 카페가 되고, 태양사진관은 셔터가 내려가 있었다.

누나는 근무복 위에 카디건을 걸치고 들어왔다. 마흔일곱. 머리에 흰 것이 섞였다. 손등이 거칠었다. 요양보호사 십사 년의 손이다.

"밥 먹었어?"

"아직."

"먹자. 나 배고파."

우리는 백반을 두 개 시켰다. 누나는 밥을 다 먹을 때까지 아무 말도 하지 않았다. 콩나물국을 두 번 떠먹고, 김치를 잘라 먹고, 밥그릇을 비웠다. 나는 그 십오 분을 견뎠다.

숭늉을 마시고 누나가 말했다.

"1992년 8월 12일. 밤에."

나는 젓가락을 놓았다.

"나 그때 열세 살이었어. 아버지가 저녁에 없었어. 너는 마당에서 자고 있었어. 여름이라 모기장 치고 마루에서 자고. 나는 방에서 라디오 듣고 있었어."

"…응."

"열 시쯤 대문에서 소리가 났어. 사람이 쿵쿵거리는 소리."

누나는 손으로 컵을 감쌌다.

"명수 아저씨였어. 알지? 아버지 사진관 조수 하다가 철물점 하던. 아저씨가 엄마를 업고 있었어."

식당의 형광등이 웅, 하고 울었다.

"엄마가 다 젖어 있었어. 머리부터 발끝까지. 흙 냄새가 났어. 아저씨도 젖어 있었어. 바지가 다 젖어서 걸을 때마다 물이 떨어졌어. 아저씨가 엄마를 마루에 앉혔어. 엄마는 앉아 있었어. 눈은 뜨고 있었어. 숨을 쉬고 있었어."

"…살아 있었어?"

"살아 있었어."

나는 두 손을 무릎에 놓았다.

작업 반장이 나에게 물었다.

"저자분이세요?"

"네."

"이런 거 처음 보시죠."

"저는 십사 년 했어요." 그가 목장갑을 털었다. "매달 이래요. 책은 많이 나오고 많이 없어져요. 근데 저자분이 직접 오는 건 처음 봐요."

"그럼요." 반장이 말했다. "다 돌아와요, 이게. 없어지는 건 없어요. 모양만 바뀌어요."

인세는 이억 오천사백만 원이었다.

"…"

그걸 알아차린 순간 나는 컴퓨터를 껐다.

세 번째 안을 나는 이월 중순에 청주에서 찾았다.

작업은 삼월에 시작해서 그해 십일월까지 갔다.

스캔 업체 하나, 개인정보 처리 자문 변호사 하나, 아르바이트생 넷. 총 일억 사천만 원이 들었다. 나머지 돈으로 나는 세금을 내고, 딸의 학원비 이 년분을 아내 계좌로 보내고, 삼백만 원으로 중고 스캐너 한 대를 샀다.

나는 결국 썼다. 이 세 문장을 남기기 위해서 썼다고 나는 스스로에게 말한다. 그것이 정직한지 나는 모른다. 이 이야기에서 내가 정직한지 모르겠다고 쓴 곳이 열두 군데인데, 열두 군데 다 진짜로 모른다.

한유리는 이월 이십팔일에 퇴사했다.

"…"

"서진우 씨."

"네."

"다시 쓰세요."

"쓸 수 있을까요."

나는 이월 이십칠일에 사직서를 냈다.

십구 년 이 개월. 반려는 없었다. 인사팀 동기가 서류를 받으면서 나에게 이렇게 물었다.

"진우야, 다음 회사 정했어?"

"안 정했어."

"그럼 왜 지금 내?"

"…"

나는 대답을 준비하지 않았다. 그런데 대답이 나왔다.

"열한 명 중에 아무도 안 물어봤어. 그 열한 명한테."

동기는 볼펜을 놓았다.

"…그건 우리가 할 일이 아니었어."

"응. 우리 일이 아니었어." 내가 말했다. "그래서 나가는 거야."

---

마지막 날은 삼월 십삼일 금요일이었다.

배윤철 팀장이 나를 회의실로 불렀다. 그는 종이컵 두 개에 커피를 따랐다.

"서 차장."

"네."

"나 그 책 다 읽었어."

나는 고개를 들었다.

"두 번 읽었어. 두 번째는 파쇄한다는 기사 보고 읽었어."

"…"

"우리 아버지는 아직 살아 계셔. 여든넷. 요양원에 계셔." 그가 커피를 들었다. "나 두 달에 한 번 가. 두 달에 한 번이면 많이 가는 거라고 나는 생각했어. 그런데 자네 책 읽고 그 숫자를 세어 봤어. 일 년에 여섯 번이야. 아버지 앞으로 오 년 사시면 서른 번 남았어."

배윤철은 커피를 마셨다. 그의 손이 조금 떨렸다.

"서른 번이야, 서 차장."

"…"

"내가 자네한테 미안한 게 하나 있어." 그가 말했다. "그 보고서에서 세 문장 뺀 사람 나야."

나는 그를 봤다.

"위에서 뺀 게 아니야. 내가 뺐어. 그거 들어가면 임원 보고가 길어져. 그리고 그 세 문장 넣어도 결과는 똑같아. 나는 그거 알았어. 그래서 뺐어."

"…"

"근데 자네가 그걸 쓴 사람이라는 건 기록에 남아야 했어." 배윤철이 종이컵을 내려놓았다. "그걸 내가 없앴어. 미안해."

나는 십구 년 동안 이 사람이 웃으면 웃었다. 그리고 마지막 날에 이 사람이 사과하는 것을 봤다.

"팀장님."

"아버님 다음 달에 가시면, 사진 한 장 찍으세요."

"…사진?"

"휴대폰으로요. 정면으로요. 웃으라고 하지 마시고요."

배윤철은 종이컵을 손에 쥔 채로 이 분쯤 아무 말도 하지 않았다.

닷징과 버닝이다.

첫째. **사람이 죽으면 남는 것은 짐이다.**

나는 어머니의 노트를 펴 놓고, 2005년 어느 날의 기록을 봤다.

나는 그 문장을 원고의 첫 장에 옮겨 적었다. 그리고 그 아래에 이렇게 썼다.

> — 정선희 (1958 - 2013), 남기지 않은 노트에서

그것이 이 소설의 첫 문장이 되었다.

한자로 未現像. 아직 나타나지 않은 것. 필름 속에서 상이 잠들어 있는 상태. 있는 것도 아니고 없는 것도 아닌 것.

"네."

"이 건물 다음 달에 철거해요. 군에서 결정 났어요. 안전 문제로요."

나는 창문을 봤다.

"…알고 오셨어요?"

"알고 왔어요." 곽성재가 말했다. "그래서 오늘 온 거예요. 오늘 아니면 못 오니까."

---

다인이는 그 창가에서 사진을 여섯 장 찍었다.

물. 물. 삼각대가 있는 둑. 창틀. 벽의 옷걸이. 그리고 내 뒷모습.

마지막 한 장을 찍기 전에 딸이 말했다.

"아빠, 돌아봐."

나는 돌아봤다.

"웃지 마."

나는 웃지 않았다.

셔터가 열리고 닫혔다. 그것이 서른여섯 번째 프레임이었다.

---

우리는 정오쯤 내려왔다. 김밥을 먹었다. 곽성재가 얼린 생수를 나눠 줬다. 누나가 다인이에게 용돈을 줬다. 다인이는 거절하는 척하다가 받았다.

나는 삼각대를 접었다. 그날 나는 사진을 한 장도 찍지 않았다.

찍을 필요가 없었다. 아버지가 서른세 번 찍은 것을 나는 이제 알았다. 그것은 물이 아니었고 창문도 아니었다. 그것은 사백 미터였다.

---

그 필름은 팔월 십사일 밤에 현상했다.

태양사진관 뒤쪽, 문틈에 검은 테이프를 붙인 이 평짜리 방에서. 확대기와 트레이 세 개와 빨랫줄과 나무 집게 열두 개가 있는 방에서. 나는 사월에 그 방을 다시 쓸 수 있게 만들었다.

이십 도. 육 분 삼십 초. 삼십 초. 오 분. 물.

젖은 필름을 붉은 안전등 아래서 들었을 때, 서른여섯 프레임이 다 나와 있었다.

나는 마지막 프레임을 봤다.

폐건물 이 층 방의 창가에, 마흔네 살 남자가 서 있었다. 역광이라 얼굴이 어두웠다. 웃지 않았다. 어깨가 조금 처져 있었다.

나는 그것을 인화했다. 8×10 인화지에, 노출 십이 초. 얼굴이 너무 어두워서 왼쪽 뺨에 삼 초를 닷징했다.

김 씨 아저씨의 영정 사진처럼.

인화지를 정착액에서 꺼내 물에 담그면서 나는 아버지의 메모를 생각했다. 왼쪽 얼굴 3초 닷징. 그늘 너무 깊음.

그게 아버지가 사람에게 해 준 일이었다.

---

『미현상』은 이듬해 봄에 나왔다.

먼바다에서 냈다. 임정호 대표가 그러자고 했다. 초판 삼천 부였다. 표지는 흰색이었고, 가운데에 검은 사각형이 하나 있었다. 검은 사각형은 현상된 필름의 프레임이라고 디자이너가 설명했다.

편집은 한유리가 했다. 그녀는 일 년 만에 다시 편집을 했고, 이 책만 하고 다시 그만두었다. 그녀가 마지막 교정지를 넘기면서 이렇게 말했다.

"서진우 씨. 이번엔 물어봤죠?"

"열 명한테 다 물어봤습니다."

"몇 명이 거절했어요?"

"한 명이요."

"누구요?"

나는 웃었다.

"제 딸이요. 그래서 이름을 바꿨습니다."

한유리는 교정지를 가방에 넣었다.

"그게 이 책이에요." 그녀가 말했다.

---

책은 많이 팔리지 않았다.

이 년 동안 만 사천 부. 앞의 책의 십분의 일이 안 된다. 서평은 여섯 개 나왔다. 방송은 없었다. 강연 요청은 두 번 왔고 나는 두 번 다 갔다. 한 번은 열한 명이 왔고, 한 번은 서른 명이 왔다.

나는 그것으로 충분했다.

이 책에는 이백여든두 쪽 같은 것이 없다. 라디오에서 낭독할 문장이 없다. 띠지에 인쇄할 문장이 없다. 사람들이 울면서 사진 찍어 올릴 페이지가 없다.

대신 이 책에는 무엇을 가렸는지가 적혀 있다.

열두 군데에 나는 이렇게 썼다. 이것이 정직한지 나는 모른다. 그것이 내가 이 책에서 유일하게 확신하는 문장들이다.
`

말한다. 채웠다고 말한다.

없어.

없어?

지금은 좀 후회한다. 그런데 아빠한테 말은 안 했다.

---

작년 팔월에 언덕에서 내려오면서 아빠가 물었다.

다인아, 아빠 다음 책 써도 될까.

무슨 얘기.

아빠 얘기. 이 다음 얘기.

아빠, 나한테 물어봤으니까 됐어.

아빠는 그걸 허락으로 들었을 것이다.

그러니까 이 글이 여기 실려 있을 것이다.

---

      if (!buf.length) { mode = null; return; }
      if (mode === 'p') {
        out.push('<p>' + inline(buf.join(' ')) + '</p>');
      } else if (mode === 'quote') {
        out.push('<blockquote>' + buf.map(function (l) {
          return '<p>' + inline(l) + '</p>';
        }).join('') + '</blockquote>');
      } else if (mode === 'log') {
        out.push('<pre class="log">' + buf.map(function (l) {
          return esc(l).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        }).join('\n') + '</pre>');
      } else if (mode === 'caption') {
        out.push('<div class="caption">' + buf.map(function (l) {
          return inline(l);
        }).join('<br>') + '</div>');
      }
      buf = [];
      mode = null;
    }

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.trim();

      if (line === '') { flush(); continue; }
      if (line === '---') { flush(); out.push('<div class="sep"></div>'); continue; }

      if (line.indexOf('## ') === 0) {
        flush();
        out.push('<h3>' + inline(line.slice(3)) + '</h3>');
        continue;
      }
      if (line.charAt(0) === '>') {
        if (mode !== 'quote') flush();
        mode = 'quote';
        buf.push(line.replace(/^>\s?/, ''));
        continue;
      }
      if (line.charAt(0) === '|') {
        if (mode !== 'log') flush();
        mode = 'log';
        buf.push(line.replace(/^\|\s?/, ''));
        continue;
      }
      if (line.charAt(0) === '@') {
        if (mode !== 'caption') flush();
        mode = 'caption';
        buf.push(line.replace(/^@\s?/, ''));
        continue;
      }
      if (mode !== 'p') flush();
      mode = 'p';
      buf.push(line);
    }
    flush();
    return out.join('\n');
  }

  /* ---------------- 데이터 준비 ---------------- */
  var chapters = N.chapters.slice().sort(function (a, b) { return a.no - b.no; });
  var partsById = {};
  N.parts.forEach(function (p) { partsById[p.id] = p; });

  var totalChars = 0;
  chapters.forEach(function (c) {
    c.chars = String(c.body).replace(/\s/g, '').length;
    totalChars += c.chars;
  });

  var readSet = {};
  (load(LS_READ, []) || []).forEach(function (n) { readSet[n] = true; });

  var current = -1; // -1 = 표지

  function minutes(chars) { return Math.max(1, Math.round(chars / 700)); }

  el.coverMeta.textContent =
    '전 ' + chapters.length + '화 · 약 ' + totalChars.toLocaleString('ko-KR') + '자 · 예상 독서 ' +
    Math.round(totalChars / 700 / 60 * 10) / 10 + '시간';

  /* ---------------- 목차 ---------------- */
  function buildToc() {
    var html = '';
    var lastVol = null, lastPart = null;
    chapters.forEach(function (c, idx) {
      var part = partsById[c.part] || {};
      if (part.volume !== lastVol) {
        lastVol = part.volume;
        var vol = (N.volumes.filter(function (v) { return v.no === lastVol; })[0]) || {};
        html += '<div class="toc__vol">제' + (lastVol || 1) + '권 ' + (vol.title || '') + '</div>';
      }
      if (c.part !== lastPart) {
        lastPart = c.part;
        html += '<div class="toc__part"><b>' + (part.label || '') + ' ' + (part.title || '') +
                '</b><i>' + (part.hanja || '') + '</i></div>';
      }
      html += '<button class="toc__item" data-idx="' + idx + '" data-t="' + (c.title || '').replace(/"/g, '') + '">' +
              '<span class="toc__no">' + c.no + '화</span>' +
              '<span class="toc__t">' + c.title + '</span>' +
              '<span class="toc__dot"></span></button>';
    });
    el.tocList.innerHTML = html;
  }

  function refreshToc() {
    var items = el.tocList.querySelectorAll('.toc__item');
    Array.prototype.forEach.call(items, function (b) {
      var i = +b.getAttribute('data-idx');
      b.classList.toggle('is-current', i === current);
      b.classList.toggle('is-read', !!readSet[chapters[i].no]);
    });
    var readCount = chapters.filter(function (c) { return readSet[c.no]; }).length;
    el.tocStats.textContent = '읽은 화 ' + readCount + ' / ' + chapters.length +
      ' · 전체 약 ' + totalChars.toLocaleString('ko-KR') + '자';
  }

  el.tocList.addEventListener('click', function (e) {
    var b = e.target.closest('.toc__item');
    if (!b) return;
    go(+b.getAttribute('data-idx'));
    closeToc();
  });

  el.tocSearch.addEventListener('input', function () {
    var q = el.tocSearch.value.trim().toLowerCase();
    Array.prototype.forEach.call(el.tocList.querySelectorAll('.toc__item'), function (b) {
      var t = (b.getAttribute('data-t') || '').toLowerCase();
      b.style.display = (!q || t.indexOf(q) > -1) ? '' : 'none';
    });
    Array.prototype.forEach.call(el.tocList.querySelectorAll('.toc__vol,.toc__part'), function (d) {
      d.style.display = q ? 'none' : '';
    });
  });

  /* ---------------- 오버레이 ---------------- */
  function openToc() {
    el.scrim.hidden = false;
    requestAnimationFrame(function () { el.scrim.classList.add('is-open'); });
    el.toc.classList.add('is-open');
    el.toc.setAttribute('aria-hidden', 'false');
    el.btnToc.setAttribute('aria-expanded', 'true');
    el.body.classList.add('is-locked');
    var cur = el.tocList.querySelector('.is-current');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }
  function closeToc() {
    el.toc.classList.remove('is-open');
    el.toc.setAttribute('aria-hidden', 'true');
    el.btnToc.setAttribute('aria-expanded', 'false');
    el.body.classList.remove('is-locked');
    hideScrim();
  }
  function openSheet() {
    el.sheet.hidden = false;
    requestAnimationFrame(function () { el.sheet.classList.add('is-open'); });
    el.scrim.hidden = false;
    requestAnimationFrame(function () { el.scrim.classList.add('is-open'); });
    el.btnSettings.setAttribute('aria-expanded', 'true');
  }
  function closeSheet() {
    el.sheet.classList.remove('is-open');
    el.btnSettings.setAttribute('aria-expanded', 'false');
    setTimeout(function () { if (!el.sheet.classList.contains('is-open')) el.sheet.hidden = true; }, 240);
    hideScrim();
  }
  function hideScrim() {
    if (el.toc.classList.contains('is-open') || el.sheet.classList.contains('is-open')) return;
    el.scrim.classList.remove('is-open');
    setTimeout(function () { if (!el.scrim.classList.contains('is-open')) el.scrim.hidden = true; }, 240);
  }

  el.btnToc.addEventListener('click', function () {
    el.toc.classList.contains('is-open') ? closeToc() : openToc();
  });
  el.btnTocClose.addEventListener('click', closeToc);
  el.btnSettings.addEventListener('click', function () {
    el.sheet.classList.contains('is-open') ? closeSheet() : openSheet();
  });
  el.scrim.addEventListener('click', function () { closeToc(); closeSheet(); });

  /* ---------------- 화 이동 ---------------- */
  function chapterHtml(c, idx) {
    var part = partsById[c.part] || {};
    var next = chapters[idx + 1];
    var h = '';
    h += '<div class="chead">';
    h += '<p class="chead__part">제' + (part.volume || 1) + '권 · ' + (part.label || '') + ' ' + (part.title || '') + '</p>';
    h += '<p class="chead__no">제 ' + c.no + ' 화</p>';
    h += '<h2 class="chead__title">' + c.title + '</h2>';
    h += '<div class="chead__rule"></div>';
    h += '</div>';
    h += '<div class="body">' + render(c.body) + '</div>';
    h += '<div class="chend"><div class="chend__mark">· · ·</div>';
    if (next) {
      h += '<button class="nextcard" data-next="' + (idx + 1) + '">' +
           '<span class="nextcard__k">다음 화 · 제 ' + next.no + ' 화</span>' +
           '<span class="nextcard__t">' + next.title + '</span></button>';
    } else {
      h += '<div class="theend"><b>끝</b><span>제1권 「미현상」 완결 — 읽어 주셔서 고맙습니다.</span></div>';
    }
    h += '</div>';
    return h;
  }

  function go(idx, opts) {
    opts = opts || {};
    if (idx < 0 || idx >= chapters.length) return;
    current = idx;
    var c = chapters[idx];

    el.cover.hidden = true;
    el.reader.hidden = false;
    el.pager.hidden = false;
    el.reader.innerHTML = chapterHtml(c, idx);

    var part = partsById[c.part] || {};
    el.topbarChap.textContent = c.no + '화 ' + c.title;
    document.title = c.no + '화 ' + c.title + ' — 미현상';

    el.btnPrev.disabled = idx === 0;
    el.btnNext.disabled = idx === chapters.length - 1;

    readSet[c.no] = true;
    save(LS_READ, Object.keys(readSet).map(Number));
    refreshToc();

    if (opts.ratio) {
      requestAnimationFrame(function () {
        var max = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo(0, Math.max(0, max * opts.ratio));
      });
    } else {
      window.scrollTo(0, 0);
    }

    if (location.hash !== '#' + c.no) {
      history.replaceState(null, '', '#' + c.no);
    }
    savePos();
    el.topbar.classList.remove('is-hidden');
  }

  function showCover() {
    current = -1;
    el.reader.hidden = true;
    el.pager.hidden = true;
    el.cover.hidden = false;
    el.topbarChap.textContent = '표지';
    document.title = '미현상(未現像) — 아버지의 서른세 번째 여름';
    window.scrollTo(0, 0);
    refreshToc();
  }

  el.reader.addEventListener('click', function (e) {
    var b = e.target.closest('[data-next]');
    if (b) go(+b.getAttribute('data-next'));
  });
  el.btnPrev.addEventListener('click', function () { go(current - 1); });
  el.btnNext.addEventListener('click', function () { go(current + 1); });
  el.btnTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el.btnStart.addEventListener('click', function () { go(0); });

  /* ---------------- 위치 저장 ---------------- */
  function savePos() {
    if (current < 0) return;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var ratio = max > 0 ? window.scrollY / max : 0;
    save(LS_POS, { no: chapters[current].no, ratio: Math.min(1, Math.max(0, ratio)) });
  }

  var saveTimer = null;
  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var ratio = max > 0 ? window.scrollY / max : 0;

    if (current >= 0) {
      var overall = (current + Math.min(1, Math.max(0, ratio))) / chapters.length;
      el.progressBar.style.width = (overall * 100).toFixed(2) + '%';
    } else {
      el.progressBar.style.width = '0%';
    }

    // 상단바 자동 숨김
    var y = window.scrollY;
    if (y > 180 && y > lastY + 6) el.topbar.classList.add('is-hidden');
    else if (y < lastY - 6 || y < 120) el.topbar.classList.remove('is-hidden');
    lastY = y;

    clearTimeout(saveTimer);
    saveTimer = setTimeout(savePos, 350);
  }
  var lastY = 0;
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('beforeunload', savePos);

  /* ---------------- 키보드 ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) {
      if (e.key === 'Escape') { el.tocSearch.blur(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    switch (e.key) {
      case 'ArrowRight':
        if (current >= 0) { go(current + 1); e.preventDefault(); } break;
      case 'ArrowLeft':
        if (current > 0) { go(current - 1); e.preventDefault(); } break;
      case 'Escape':
        closeToc(); closeSheet(); break;
      case 't': case 'T':
        el.toc.classList.contains('is-open') ? closeToc() : openToc(); break;
      case 'd': case 'D':
        el.btnTheme.click(); break;
      case 'c': case 'C':
        showCover(); break;
    }
  });

  /* ---------------- 스와이프 ---------------- */
  var tx = 0, ty = 0, tt = 0;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (current < 0 || !e.changedTouches.length) return;
    if (el.toc.classList.contains('is-open') || el.sheet.classList.contains('is-open')) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Date.now() - tt > 600) return;
    if (Math.abs(dx) < 80 || Math.abs(dy) > 55) return;
    dx < 0 ? go(current + 1) : go(current - 1);
  }, { passive: true });

  /* ---------------- 초기화 ---------------- */
  applySettings();
  buildToc();
  refreshToc();

  var pos = load(LS_POS, null);
  if (pos && pos.no) {
    var found = -1;
    chapters.forEach(function (c, i) { if (c.no === pos.no) found = i; });
    if (found > -1) {
      el.btnResume.hidden = false;
      el.btnResume.textContent = '이어서 읽기 · ' + pos.no + '화';
      el.btnResume.addEventListener('click', function () { go(found, { ratio: pos.ratio }); });
    }
  }

  var hashNo = parseInt((location.hash || '').replace('#', ''), 10);
  if (hashNo) {
    var hi = -1;
    chapters.forEach(function (c, i) { if (c.no === hashNo) hi = i; });
    if (hi > -1) go(hi);
  }

  window.addEventListener('hashchange', function () {
    var n = parseInt((location.hash || '').replace('#', ''), 10);
    if (!n) return;
    var i = -1;
    chapters.forEach(function (c, idx) { if (c.no === n) i = idx; });
    if (i > -1 && i !== current) go(i);
  });

  onScroll();
})();
</script>

</html>
